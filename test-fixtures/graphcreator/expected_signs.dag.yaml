schema: graphcreator/0.1
name: Sign shapes
nodes:
  - name: Smoking
    var_type: categorical
    levels: [never, former, current]
  - name: Diabetes
    var_type: categorical
    levels: ["no", "yes"]
  - name: Sex
    var_type: categorical
    levels: [female, male]
  - name: Age
    var_type: continuous
    unit: years
  - name: Severity
    var_type: ordinal
    levels: [mild, moderate, severe]
  - name: Wound class
    var_type: categorical
    levels: [clean, clean-contaminated, contaminated]
  - name: Outcome
    role: outcome
    var_type: categorical
    levels: ["no", "yes"]
edges:
  - from: Smoking
    to: Outcome
    sign: {never: negative, former: positive, current: positive}
    strength: medium
  - from: Diabetes
    to: Outcome
    sign: positive
  - from: Sex
    to: Outcome
    sign: {female: negative, male: positive}
  - from: Diabetes
    to: Severity
    sign: {"no": negative, "yes": positive}
  - from: Age
    to: Severity
    sign: positive
  - from: Age
    to: Wound class
    sign: {clean: negative, contaminated: positive}
  - from: Severity
    to: Outcome
    sign: positive
    strength: large
  - from: Wound class
    to: Outcome
    sign: {clean: negative, clean-contaminated: positive, contaminated: positive}
  - from: Smoking
    to: Wound class
    strength: small
